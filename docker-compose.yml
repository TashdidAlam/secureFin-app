# =============================================================================
# SecureFin App — Local Development with Docker
# =============================================================================
# Usage:
#   docker compose up --build        → Build and run
#   docker compose up --build -d     → Run in background
#   docker compose down              → Stop and remove
#
# Endpoints:
#   http://localhost:8080             → Frontend dashboard
#   http://localhost:8080/api         → Backend API
#   http://localhost:8080/healthz     → Health check
# =============================================================================

services:
  securefin-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - APP_VERSION=local
      - AZURE_REGION=local
      - PORT=8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
