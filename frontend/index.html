<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureFin Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .card h1 {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
      color: #38bdf8;
    }
    .card .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid #334155;
      font-size: 0.95rem;
    }
    .row:last-child { border-bottom: none; }
    .label { color: #94a3b8; }
    .value { color: #f1f5f9; font-weight: 500; }
    .status {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
    }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SecureFin</h1>
    <p class="subtitle">Financial Services Platform</p>
    <div id="data">
      <div class="row"><span class="label">Loading...</span></div>
    </div>
    <p id="status" class="status">Connecting to API...</p>
  </div>

  <script>
    // In Kubernetes the frontend is served by the backend on the same origin.
    // Locally, the backend runs on http://localhost:8080.
    const API_URL = window.location.origin + "/api";

    async function fetchData() {
      const el = document.getElementById("data");
      const st = document.getElementById("status");
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        el.innerHTML = Object.entries(data)
          .map(([k, v]) => `<div class="row"><span class="label">${k}</span><span class="value">${v}</span></div>`)
          .join("");
        st.textContent = "Connected";
        st.className = "status ok";
      } catch (err) {
        el.innerHTML = `<div class="row"><span class="label">Error</span><span class="value">${err.message}</span></div>`;
        st.textContent = "Disconnected";
        st.className = "status err";
      }
    }

    fetchData();
    setInterval(fetchData, 10000);
  </script>
</body>
</html>
